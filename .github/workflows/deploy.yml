name: Deploy Jai Deva CMS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: the-gold-technologies/deployment-workflows/.github/workflows/deploy-nextjs.yml@main

    with:
      app_key: jaideva-cms

    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
